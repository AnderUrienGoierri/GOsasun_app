<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#0b1020"/>
  <text x="70" y="70" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="34">Hasierako C# proiektutik installer-era: azken fluxua</text>
  <rect x="70" y="140" width="240" height="140" rx="18" fill="#1e293b" stroke="#38bdf8"/>
  <text x="130" y="205" fill="#e0f2fe" font-family="Segoe UI, Arial" font-size="28">1. Iturburu kodea</text>
  <text x="108" y="240" fill="#bae6fd" font-family="Consolas, monospace" font-size="20">GOsasun_app.csproj</text>
  <line x1="310" y1="210" x2="410" y2="210" stroke="#38bdf8" stroke-width="5"/>
  <polygon points="410,210 388,198 388,222" fill="#38bdf8"/>
  <rect x="430" y="140" width="240" height="140" rx="18" fill="#1e293b" stroke="#38bdf8"/>
  <text x="483" y="205" fill="#e0f2fe" font-family="Segoe UI, Arial" font-size="28">2. Publish</text>
  <text x="466" y="240" fill="#bae6fd" font-family="Consolas, monospace" font-size="20">publish\win-x64</text>
  <line x1="670" y1="210" x2="770" y2="210" stroke="#38bdf8" stroke-width="5"/>
  <polygon points="770,210 748,198 748,222" fill="#38bdf8"/>
  <rect x="790" y="140" width="240" height="140" rx="18" fill="#1e293b" stroke="#38bdf8"/>
  <text x="833" y="205" fill="#e0f2fe" font-family="Segoe UI, Arial" font-size="28">3. Inno Setup</text>
  <text x="845" y="240" fill="#bae6fd" font-family="Consolas, monospace" font-size="20">ISCC.exe</text>
  <line x1="1030" y1="210" x2="1130" y2="210" stroke="#38bdf8" stroke-width="5"/>
  <polygon points="1130,210 1108,198 1108,222" fill="#38bdf8"/>
  <rect x="1150" y="140" width="180" height="140" rx="18" fill="#1e293b" stroke="#38bdf8"/>
  <text x="1178" y="205" fill="#e0f2fe" font-family="Segoe UI, Arial" font-size="28">4. Setup.exe</text>
  <text x="1176" y="240" fill="#bae6fd" font-family="Consolas, monospace" font-size="18">deployment\output</text>
  <rect x="100" y="360" width="1180" height="380" rx="24" fill="#111827" stroke="#334155"/>
  <text x="140" y="420" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="30">Target PC-an gertatzen dena</text>
  <text x="160" y="475" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="24">1. Erabiltzaileak GOsasun_app_Setup.exe exekutatzen du.</text>
  <text x="160" y="520" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="24">2. Instalatzaileak publish karpetako fitxategiak kopiatzen ditu {app} helburura.</text>
  <text x="160" y="565" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="24">3. appsettings.json sortzen du instalazioan emandako balioekin.</text>
  <text x="160" y="610" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="24">4. Lehen abioan, aplikazioak karpetak sortu, SQL scriptak exekutatu eta DB probatzen du.</text>
  <text x="160" y="655" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="24">5. Dena ondo badoa, erabiltzailea login pantailara iristen da ingurune prestatu batekin.</text>
  <rect x="860" y="470" width="360" height="170" rx="20" fill="#052e16" stroke="#22c55e"/>
  <text x="920" y="530" fill="#dcfce7" font-family="Segoe UI, Arial" font-size="28">Azken emaitza</text>
  <text x="900" y="575" fill="#bbf7d0" font-family="Segoe UI, Arial" font-size="22">PC batean instalatu daitekeen</text>
  <text x="920" y="610" fill="#bbf7d0" font-family="Segoe UI, Arial" font-size="22">GOsasun_app_Setup.exe</text>
  <text x="70" y="810" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="23">Fluxu honek erakusten du transformazioa ez dela build hutsa: konfigurazioa, bootstrap-a eta instalatzailea behar izan dira.</text>
</svg>