<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#fff7ed"/>
  <text x="70" y="70" fill="#7c2d12" font-family="Segoe UI, Arial" font-size="34">8 byteko payload-a: zer erabiltzen da benetan?</text>
  <rect x="70" y="140" width="1260" height="200" rx="24" fill="#111827"/>
  <rect x="110" y="210" width="130" height="70" rx="12" fill="#2563eb"/>
  <rect x="255" y="210" width="130" height="70" rx="12" fill="#2563eb"/>
  <rect x="400" y="210" width="130" height="70" rx="12" fill="#16a34a"/>
  <rect x="545" y="210" width="130" height="70" rx="12" fill="#7c3aed"/>
  <rect x="690" y="210" width="130" height="70" rx="12" fill="#7c3aed"/>
  <rect x="835" y="210" width="130" height="70" rx="12" fill="#f59e0b"/>
  <rect x="980" y="210" width="130" height="70" rx="12" fill="#475569"/>
  <rect x="1125" y="210" width="130" height="70" rx="12" fill="#475569"/>
  <text x="150" y="255" fill="#f8fafc" font-family="Consolas, monospace" font-size="30">d0</text>
  <text x="295" y="255" fill="#f8fafc" font-family="Consolas, monospace" font-size="30">d1</text>
  <text x="440" y="255" fill="#f8fafc" font-family="Consolas, monospace" font-size="30">d2</text>
  <text x="585" y="255" fill="#f8fafc" font-family="Consolas, monospace" font-size="30">d3</text>
  <text x="730" y="255" fill="#f8fafc" font-family="Consolas, monospace" font-size="30">d4</text>
  <text x="875" y="255" fill="#111827" font-family="Consolas, monospace" font-size="30">d5</text>
  <text x="1020" y="255" fill="#f8fafc" font-family="Consolas, monospace" font-size="30">d6</text>
  <text x="1165" y="255" fill="#f8fafc" font-family="Consolas, monospace" font-size="30">d7</text>
  <rect x="90" y="390" width="1220" height="360" rx="24" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  <text x="130" y="445" fill="#7c2d12" font-family="Segoe UI, Arial" font-size="28">Driver-ak egiten duen interpretazioa</text>
  <text x="130" y="505" fill="#334155" font-family="Segoe UI, Arial" font-size="24">`data[0] + 25` → presio sistolikoa</text>
  <text x="130" y="545" fill="#334155" font-family="Segoe UI, Arial" font-size="24">`data[1] + 25` → presio diastolikoa</text>
  <text x="130" y="585" fill="#334155" font-family="Segoe UI, Arial" font-size="24">`data[2]` → pultsua ppm</text>
  <text x="130" y="625" fill="#334155" font-family="Segoe UI, Arial" font-size="24">`data[3]` eta `data[4]` → U2 bita detektatzeko eta hilabetea balidatzeko erabiltzen dira</text>
  <text x="130" y="665" fill="#334155" font-family="Segoe UI, Arial" font-size="24">`data[5]` → eguna balidatzeko erabiltzen da</text>
  <text x="130" y="705" fill="#334155" font-family="Segoe UI, Arial" font-size="24">`data[6]` eta `data[7]` → gaur egungo inplementazioan ez dira Jarraipena datara mapatzen</text>
  <rect x="770" y="470" width="470" height="200" rx="18" fill="#0f172a"/>
  <text x="800" y="525" fill="#93c5fd" font-family="Consolas, monospace" font-size="24">int si = r.Data[0] + 25;</text>
  <text x="800" y="565" fill="#93c5fd" font-family="Consolas, monospace" font-size="24">int di = r.Data[1] + 25;</text>
  <text x="800" y="605" fill="#93c5fd" font-family="Consolas, monospace" font-size="24">int pu = r.Data[2];</text>
  <text x="800" y="645" fill="#fca5a5" font-family="Consolas, monospace" font-size="21">ErregistroData = DateTime.Now;</text>
  <text x="90" y="830" fill="#7c2d12" font-family="Segoe UI, Arial" font-size="22">Puntu garrantzitsua: aurreko interpretazio batzuek data/ordua inferitzen zuten, baina gaur egungo kodeak ez du hori persistitzen.</text>
</svg>