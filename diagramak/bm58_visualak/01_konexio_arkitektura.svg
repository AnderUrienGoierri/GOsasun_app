<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#eff6ff"/>
  <text x="70" y="70" fill="#0f172a" font-family="Segoe UI, Arial" font-size="34">BM58 integrazioaren arkitektura orokorra</text>
  <rect x="90" y="170" width="260" height="150" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="145" y="235" fill="#1e3a8a" font-family="Segoe UI, Arial" font-size="28">Beurer BM58</text>
  <text x="118" y="272" fill="#1e3a8a" font-family="Segoe UI, Arial" font-size="21">Erabiltzailearen gailua</text>
  <text x="125" y="305" fill="#475569" font-family="Segoe UI, Arial" font-size="20">Pantailan "PC" agertu behar du</text>
  <rect x="510" y="170" width="360" height="150" rx="20" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="583" y="235" fill="#14532d" font-family="Segoe UI, Arial" font-size="28">BM58Driver</text>
  <text x="565" y="272" fill="#14532d" font-family="Segoe UI, Arial" font-size="21">HID lehentasunez, COM fallback</text>
  <text x="560" y="305" fill="#475569" font-family="Segoe UI, Arial" font-size="20">handshake + bankuen irakurketa</text>
  <rect x="1030" y="170" width="280" height="150" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1078" y="235" fill="#4c1d95" font-family="Segoe UI, Arial" font-size="28">Tentsiometro</text>
  <text x="1080" y="272" fill="#4c1d95" font-family="Segoe UI, Arial" font-size="21">Neurketak UI</text>
  <text x="1072" y="305" fill="#475569" font-family="Segoe UI, Arial" font-size="20">inportazio fluxua</text>
  <line x1="350" y1="245" x2="510" y2="245" stroke="#2563eb" stroke-width="6"/>
  <polygon points="510,245 486,232 486,258" fill="#2563eb"/>
  <line x1="870" y1="245" x2="1030" y2="245" stroke="#16a34a" stroke-width="6"/>
  <polygon points="1030,245 1006,232 1006,258" fill="#16a34a"/>
  <rect x="130" y="450" width="1120" height="250" rx="24" fill="#0f172a"/>
  <text x="170" y="510" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="28">Fluxu osoa</text>
  <text x="170" y="565" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="24">1. BM58 gailua USB bidez konektatzen da eta "PC" moduan jartzen da.</text>
  <text x="170" y="610" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="24">2. BM58Driver-ek HID gailua bilatzen du VID 0x0C45 eta PID 0x7406 balioekin.</text>
  <text x="170" y="655" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="24">3. Handshake-a egiten da, bankuak irakurri, byte gordina balidatu eta U1/U2 memoriak bereizten dira.</text>
  <text x="170" y="700" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="24">4. UI-k azken neurketa edo batezbestekoa aukeratzen du, eta datua DB-ra eta XML-ra esportatzen da.</text>
  <text x="90" y="810" fill="#475569" font-family="Segoe UI, Arial" font-size="22">Irudi honek hardwaretik aplikaziorainoko kate osoa erakusten du.</text>
</svg>